name: Docker

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-healthcheck:
    name: Build image and verify /health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up BuildKit (GitHub Actions cache backend)
        uses: docker/setup-buildx-action@v4
      - name: Build image
        run: |
          docker buildx build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --load \
            -t template-app .
      - name: Run container
        run: docker run -d --rm -p 3521:3000 --name template-app template-app
      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3521/health >/dev/null 2>&1; then
              echo "health ok"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker logs template-app
          exit 1
      - name: Stop container
        if: ${{ always() }}
        run: docker rm -f template-app || true
