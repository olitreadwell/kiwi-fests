name: CI

on:
  push:
    # Only long-lived branches run the push leg. Bot branches (dependabot/*,
    # renovate/*) get the same coverage from their pull_request run, so running
    # both doubled every bot push into eight extra jobs.
    branches:
      - main
      - master
      - dev
      - development
    # Docs-only pushes skip CI: the check gate runs on the PR instead.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (skip token)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - id: skip
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          MSG="${COMMIT_MSG:-$PR_TITLE}"
          if echo "$MSG" | grep -qiE '\[skip ci\]|\[ci skip\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check (mirrors npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || (hashFiles('package-lock.json') != '' && 'npm' || '') }}
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
      # Fail fast: cheap checks first, heavy work only after they pass.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [preflight, check]
    if: needs.preflight.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || (hashFiles('package-lock.json') != '' && 'npm' || '') }}
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

  meta-lint:
    # These three used to be separate jobs. Each one billed a full minute of
    # runner time minimum, so folding them together removes two billed minutes
    # from every CI run at the same wall-clock cost.
    name: Meta lint (actionlint, yamllint, codespell)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv actionlint /usr/local/bin/
      - run: actionlint
      - uses: actions/setup-python@v7
      - run: python -m pip install --quiet yamllint codespell
      - run: yamllint -c .yamllint.yml .github/ .yamllint.yml
      - run: codespell
