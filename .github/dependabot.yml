# Grouped so a normal run produces one PR per upgrade class instead of ten.
# Majors stay ungrouped and unmerged: scripts/dependabot-auto-merge.mjs only
# enables auto-merge for patch and minor bumps that are old enough to trust.
#
# Cron is the only interval that can express "about every two weeks".
# "0 4 */14 * *" fires on days 1, 15 and 29, so the gap is 12 to 17 days rather
# than exactly 14. The cronjob is read in the timezone below, so updates land at
# 04:00 Pacific/Auckland, inside the 03:00 to 06:00 window.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 4 */14 * *'
      timezone: 'Pacific/Auckland'
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 3
    labels: ['dependencies']
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint-plugin-storybook'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 4 */14 * *'
      timezone: 'Pacific/Auckland'
    open-pull-requests-limit: 3
    labels: ['dependencies']
    groups:
      all-dependencies:
        patterns:
          - '*'
